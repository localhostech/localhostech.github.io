<script>
(() => {
  const form = document.getElementById('gate');
  const login = document.getElementById('login');
  const password = document.getElementById('password');
  const button = document.getElementById('submit');
  const status = document.getElementById('status');
  const fromBase64 = input => Uint8Array.from(atob(input), character => character.charCodeAt(0));

  if (!globalThis.crypto?.subtle) {
    status.textContent = 'Открой страницу по HTTPS в современном браузере.';
    return;
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Открываем финмодель…';
    try {
      const sealed = JSON.parse(document.getElementById('sealed').textContent);
      const credentials = new TextEncoder().encode(JSON.stringify([login.value.trim(), password.value]));
      const baseKey = await crypto.subtle.importKey('raw', credentials, 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: fromBase64(sealed.salt), iterations: sealed.rounds, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const opened = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromBase64(sealed.iv) },
        key,
        fromBase64(sealed.ciphertext)
      );
      const model = new TextDecoder('utf-8', { fatal: true }).decode(opened);
      form.reset();
      document.open();
      document.write(model);
      document.close();
      document.getElementById('lock-model').addEventListener('click', () => location.reload());
      window.addEventListener('pageshow', event => {
        if (event.persisted) location.reload();
      });
    } catch {
      button.disabled = false;
      status.textContent = 'Проверь логин и пароль и попробуй ещё раз.';
      password.focus();
      password.select();
    }
  });
  button.disabled = false;
})();
</script>
