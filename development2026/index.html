<script>
(() => {
  const form = document.getElementById('gate');
  const field = document.getElementById('password');
  const status = document.getElementById('status');
  const button = form.querySelector('button');
  const bytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
  if (!window.crypto?.subtle) {
    button.disabled = true;
    status.textContent = 'Откройте страницу по HTTPS в современном браузере.';
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Открываем материал…';
    try {
      const data = JSON.parse(document.getElementById('sealed').textContent);
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(data.salt), iterations: data.rounds, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const clear = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.content));
      field.value = '';
      const article = new TextDecoder().decode(clear);
      document.open();
      document.write(article);
      document.close();
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    } catch {
      button.disabled = false;
      status.textContent = 'Не удалось открыть материал. Проверьте пароль.';
      field.focus();
      field.select();
    }
  });
})();
</script></body></html>
